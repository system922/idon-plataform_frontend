    <!-- ESTILOS INLINE CRÍTICOS (para pintado rápido) -->
    <!-- ============================================ -->
    <style>
      /* ============================================================
         ESTILOS CRÍTICOS PARA PRIMER PINTADO (ABOVE THE FOLD)
         Usando las variables reales de tu sistema
         ============================================================ */

      /* Variables críticas (solo las necesarias para el pintado inicial) */
      :root {
        /* Colores principales - IDON Brand */
        --primary: #f97316;
        --primary-dark: #ea580c;
        --primary-light: #fb923c;
        --primary-bg: rgba(249, 115, 22, 0.08);
        
        --blue-primary: #1A3A5C;
        --blue-dark: #0F2440;
        --blue-light: #2B5A8C;
        --blue-bg: rgba(26, 58, 92, 0.08);
        
        --success: #10b981;
        --success-dark: #059669;
        
        /* Fondos y textos */
        --bg-body: #f0f4f8;
        --bg-card: #ffffff;
        --bg-secondary: #ffffff;
        --bg-tertiary: #f8fafc;
        
        --text-primary: #1A202C;
        --text-secondary: #4A5568;
        --text-white: #ffffff;
        --text-muted: #545456;
        
        /* Bordes */
        --border-color: #E2E8F0;
        --border-light: #F1F5F9;
        
        /* Sombras */
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.1);
        
        /* Radios */
        --radius: 16px;
        --radius-sm: 8px;
        
        /* Tipografía */
        --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        --font-size-xs: 10px;
        --font-size-sm: 12px;
        --font-size-base: 14px;
        --font-size-md: 16px;
        --font-size-lg: 18px;
        --font-size-xl: 20px;
        --font-size-2xl: 24px;
        --font-size-3xl: 28px;
        --font-size-4xl: 32px;
        
        --font-weight-normal: 400;
        --font-weight-medium: 500;
        --font-weight-semibold: 600;
        --font-weight-bold: 700;
        --font-weight-extrabold: 800;
        
        /* Z-index */
        --z-dropdown: 1000;
        
        /* Transiciones */
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Estilos base */
      body {
        margin: 0;
        font-family: var(--font-family);
        background-color: var(--bg-body);
        color: var(--text-primary);
        line-height: 1.6;
      }

      .landing-container {
        font-family: var(--font-family);
        color: var(--text-primary);
        background-color: var(--bg-body);
        line-height: 1.6;
      }

      .landing-container * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ============================================================
         HEADER (CRÍTICO)
         ============================================================ */
      .landing-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.15rem 5% 0.40rem 0.75rem;
        max-width: 100%;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        position: sticky;
        top: 0;
        z-index: var(--z-dropdown);
        border-bottom: 1px solid var(--border-color);
        flex-wrap: wrap;
      }

      .landing-header .logo {
        display: flex;
        align-items: center;
        gap: 0;
        text-decoration: none;
      }

      .animated-logo {
        display: block;
        transition: transform 0.3s ease;
        height: 70px;
        width: auto;
      }

      .logo-idon,
      .logo-on {
        font-size: 1.8rem;
        font-weight: var(--font-weight-extrabold);
        letter-spacing: -1px;
        line-height: 1;
      }

      .logo-idon {
        font-family: 'Syne', sans-serif;
        color: #1A202C;
      }

      .logo-on {
        font-family: 'Syne', sans-serif;
        color: var(--primary);
      }

      .main-nav {
        display: flex;
        align-items: center;
        gap: 2rem;
        flex-wrap: wrap;
      }

      .main-nav a {
        text-decoration: none;
        color: var(--text-secondary);
        font-weight: var(--font-weight-medium);
        font-size: var(--font-size-base);
        transition: var(--transition);
        position: relative;
        padding: 0.25rem 0;
      }

      .btn-login {
        background: var(--primary);
        color: var(--text-white) !important;
        font-weight: var(--font-weight-semibold) !important;
        padding: 0.4rem 1.4rem !important;
        border-radius: 50px;
        border: 2px solid var(--primary);
        transition: var(--transition) !important;
      }

      .btn-login:hover {
        background: var(--primary-dark);
        border-color: var(--primary-dark);
        color: var(--text-white) !important;
      }

      /* ============================================================
         CONTENIDO PRINCIPAL (CRÍTICO)
         ============================================================ */
      .landing-main {
        max-width: 100%;
        margin: 0 auto;
        padding: 2rem 2% 2rem;
      }

      .landing-main h1 {
        font-size: var(--font-size-4xl);
        font-weight: var(--font-weight-extrabold);
        line-height: 1.2;
        color: var(--text-primary);
        margin-bottom: 1rem;
        letter-spacing: -0.02em;
      }

      .lead {
        font-size: var(--font-size-lg);
        font-weight: var(--font-weight-normal);
        color: var(--text-secondary);
        max-width: 850px;
        margin-bottom: 2rem;
        line-height: 1.8;
        border-left: 4px solid var(--primary);
        padding-left: 1.5rem;
      }

      .lead a {
        color: var(--primary);
        font-weight: var(--font-weight-semibold);
        text-decoration: none;
        border-bottom: 2px solid transparent;
        padding: 0 2px;
        white-space: nowrap;
      }

      .lead a:hover {
        color: var(--primary-dark);
        border-bottom-color: var(--primary);
      }

      .lead strong {
        color: var(--text-primary);
        font-weight: var(--font-weight-bold);
      }

      /* ============================================================
         IMÁGENES (CRÍTICO - Para evitar CLS)
         ============================================================ */
      .images-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        justify-items: center;
        align-items: start;
        contain: layout style;
      }

      .landing-image {
        width: 100%;
        height: auto;
        max-width: 100%;
        aspect-ratio: attr(width) / attr(height);
        object-fit: contain;
        border-radius: 5px;
        box-shadow: var(--shadow-md);
        border: 1px solid var(--border-light);
      }

      /* ============================================================
         FEATURES GRID (CRÍTICO - Si es visible en la primera pantalla)
         ============================================================ */
      .features-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1rem;
        margin: 1rem 0;
        min-height: 320px;
        contain: layout style paint;
      }

      .feature-card {
        background: var(--bg-card);
        padding: 1.5rem 1.5rem;
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
      }

      .feature-card h2,
      .feature-card h3 {
        font-size: var(--font-size-xl);
        font-weight: var(--font-weight-bold);
        margin-bottom: 0.8rem;
        color: var(--text-primary);
      }

      .feature-card h3 {
        font-size: var(--font-size-lg);
      }

      .feature-card p {
        color: var(--text-secondary);
        font-size: var(--font-size-base);
        line-height: 1.7;
      }

      .feature-card ul {
        list-style: none;
        padding: 0;
      }

      .feature-card ul li {
        padding: 0.4rem 0;
        color: var(--text-secondary);
        border-bottom: 1px solid var(--border-light);
        font-size: var(--font-size-base);
      }

      .feature-card ul li:last-child {
        border-bottom: none;
      }

      /* ============================================================
         RESPONSIVE CRÍTICO
         ============================================================ */
      @media (max-width: 768px) {
        .landing-header {
          flex-direction: column;
          padding: 0.8rem 1.5rem;
          gap: 0.8rem;
        }

        .main-nav {
          justify-content: center;
          gap: 0.8rem 1.2rem;
          width: 100%;
        }

        .main-nav a {
          font-size: var(--font-size-sm);
        }

        .btn-login {
          font-size: var(--font-size-xs) !important;
          padding: 0.3rem 1rem !important;
        }

        .landing-main {
          padding: 2rem 1.5rem 3rem;
        }

        .landing-main h1 {
          font-size: var(--font-size-2xl);
        }

        .lead {
          font-size: var(--font-size-base);
          padding-left: 1rem;
        }

        .images-grid {
          grid-template-columns: 1fr;
          gap: 1rem;
        }

        .features-grid {
          grid-template-columns: 1fr;
          gap: 1.5rem;
        }

        .feature-card {
          padding: 1.5rem;
        }
      }

      @media (max-width: 480px) {
        .landing-main h1 {
          font-size: var(--font-size-xl);
        }

        .lead {
          font-size: var(--font-size-sm);
        }

        .main-nav {
          gap: 0.5rem 0.8rem;
        }

        .main-nav a {
          font-size: 0.75rem;
        }

        .btn-login {
          font-size: 0.7rem !important;
          padding: 0.2rem 0.8rem !important;
        }
      }

      @media (min-width: 1400px) {
        .landing-main {
          max-width: 1200px;
          margin: 0 auto;
          padding: 3rem 0;
        }

        .landing-header {
          max-width: 1200px;
          padding: 0.15rem 0 0.40rem 0;
        }
      }
    </style>
  </head>

    <!-- ============================================ -->
    <!-- OPTIMIZACIÓN DE CARGA DE CSS (no bloqueante) -->
    <!-- ============================================ -->
    <script>
      (function() {
        // Convertir todos los <link rel="stylesheet"> a media="print"
        var links = document.querySelectorAll('link[rel="stylesheet"]');
        links.forEach(function(link) {
          // Si ya tiene media="print", no lo tocamos (evita duplicar)
          if (link.media !== 'print') {
            link.media = 'print';
            link.onload = function() {
              this.media = 'all';
            };
          }
        });

        // Asegurar que Google Fonts también sea no bloqueante (si no quedó cubierto)
        var fontLinks = document.querySelectorAll('link[href*="fonts.googleapis.com"]');
        fontLinks.forEach(function(link) {
          if (link.media !== 'print') {
            link.media = 'print';
            link.onload = function() {
              this.media = 'all';
            };
          }
        });
      })();
    </script>
