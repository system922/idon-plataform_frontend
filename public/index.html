    <!-- ============================================ -->

    <meta name="twitter:card" content="summary_large_image" />

    <!-- ============================================ -->
    <!-- MANIFEST                                     -->
    <!-- ============================================ -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ============================================ -->
    <!-- OPTIMIZACIÓN DE FUENTES Y CSS (NO BLOQUEANTE)-->
    <!-- ============================================ -->

    <!-- 1. Preconexión a Google Fonts (ya lo tenías, lo mantenemos) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 2. Precarga de la hoja de estilos de Google Fonts -->
    <link 
      rel="preload" 
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" 
      as="style" 
      onload="this.onload=null;this.rel='stylesheet'" 
    />
    <!-- Fallback para navegadores sin soporte de preload -->
    <noscript>
      <link 
        rel="stylesheet" 
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" 
      />
    </noscript>

    <!-- 3. Precarga del CSS principal (para que empiece a descargar en paralelo) -->
    <link 
      rel="preload" 
      href="%PUBLIC_URL%/static/css/main.52d97ffc.css" 
      as="style" 
    />
    <!-- 4. Aplicación del CSS sin bloquear el renderizado -->
    <link 
      rel="stylesheet" 
      href="%PUBLIC_URL%/static/css/main.52d97ffc.css" 
      media="print" 
      onload="this.media='all'; this.onload=null" 
    />
    <!-- Fallback para navegadores sin JavaScript -->
    <noscript>
      <link 
        rel="stylesheet" 
        href="%PUBLIC_URL%/static/css/main.52d97ffc.css" 
      />
    </noscript>

    <!-- ============================================ -->
    <!-- ESTILOS INLINE CRÍTICOS (para pintado rápido)-->
    <!-- ============================================ -->
    <style>
      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background-color: #07101a;
        color: #ffffff;
      }
    </style>
  </head>

  <body>
    <noscript>
      <!-- Mensaje opcional para usuarios sin JavaScript -->
      <p style="color: white; text-align: center; padding: 2rem;">
        IDON Control necesita JavaScript para funcionar correctamente.
      </p>
    </noscript>
